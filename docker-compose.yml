services:
  spleeter:
    build: ./spleeter-service
    container_name: spleeter-service
    restart: unless-stopped
    volumes:
      - spleeter_tmp:/tmp/spleeter
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: stem-backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - SPLEETER_URL=http://spleeter:5001
    depends_on:
      - spleeter
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: stem-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  spleeter_tmp:

networks:
  app-network:
    driver: bridge
